<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="在支持 WebAssembly JSPI 的浏览器里直接玩 Kirikiri2（吉里吉里2）引擎的视觉小说，无需安装。支持本地存档与手动同步。">
    <meta name="keywords" content="视觉小说, galgame, 吉里吉里, Kirikiri2, xp3, 浏览器, 在线">
    <meta property="og:title" content="游戏库">
    <meta property="og:description" content="在浏览器里直接玩视觉小说，无需安装。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="游戏库">
    <meta name="twitter:card" content="summary">
    <title>游戏库</title>
    <meta name="theme-color" content="#0a0a0b">

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="游戏库">
    <link rel="icon" href="/pwa/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/pwa/icon-192.png">

    <!-- 引擎不在本页加载（画廊页不需要 wasm）。低优先级预热，
         让用户点进游戏时 22MB 的 wasm 已经在 HTTP 缓存里。

         地址一律不能写死：启用 KRKR2_ENGINE_BASE 后引擎产物不在同源根下，
         而是 /engine/<版本>/ （见 public/js/config.js 的 engineBase）。
         写死会 404 —— 预热失败本身不影响功能，但控制台每次进画廊都报错，
         而且真正想要的预热一次都没发生。所以放到 config.js 之后动态注入。 -->
</head>
<body>
    <noscript>
        <div style="padding:40px 20px;text-align:center;color:#fafafa;background:#0a0a0b;min-height:100vh;max-width:720px;margin:0 auto;line-height:1.7;font-family:system-ui,sans-serif;">
            <h1 style="margin-bottom:16px;">游戏库</h1>
            <p style="margin-bottom:12px;">本站需要 JavaScript 和 WebAssembly 才能运行。请在浏览器中启用 JavaScript 后重新加载页面。</p>
        </div>
    </noscript>

    <div id="app" v-cloak></div>

    <!-- 构建配置。classic script，先于下面的 module 执行，
         为 pwa.js 提供 KrKr2Config（buildVersion / pwa 开关 / assetBase）。 -->
    <script src="/build-config.js"></script>
    <script src="/js/config.js"></script>

    <!-- 首页与设置页需要读取本地存档并在用户点击后打包；不加载 WASM。 -->
    <script src="/js/vendor/jszip.min.js"></script>
    <script src="/js/storage/idb.js"></script>

    <!-- 缓存与预下载。画廊页不加载引擎，靠这几支独立操作 OPFS 完成
         完整下载、用量展示与分游戏清理。 -->
    <script src="/js/storage/cache-store.js"></script>
    <script src="/js/storage/folder-binding.js"></script>
    <script src="/js/storage/source-probe.js"></script>
    <script src="/js/storage/downloader.js"></script>
    <script src="/js/storage/cache-admin.js"></script>

    <!-- 引擎预热：地址取自 engineBase，故必须在 config.js 之后。
         见 <head> 里那条注释。 -->
    <script>
        (function () {
            var c = window.KrKr2Config || {};
            var base = c.engineBase || c.assetBase || '/';
            [['index.wasm', 'fetch'], ['index.js', 'script']].forEach(function (it) {
                var l = document.createElement('link');
                l.rel = 'prefetch';
                l.href = base + it[0];
                l.as = it[1];
                // 同源时 crossorigin 反而会让预热的响应与后续真实请求
                // 不共用缓存条目，白下一次。仅跨源才加。
                if (/^https?:\/\//i.test(base)) l.crossOrigin = 'anonymous';
                document.head.appendChild(l);
            });
        })();
    </script>

    <script type="module" src="/src/gallery/main.js"></script>
    <script type="module" src="/src/shared/pwa.js"></script>
</body>
</html>
